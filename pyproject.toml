[project]
name = "paper-searcher"
version = "0.1.0"
description = "Traceable arXiv literature exploration with clustering and temporal visualization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.4.0",
    "arxivql>=1.3.3",
    "streamlit>=1.52.2",
    "scikit-learn>=1.5,<1.8",
    "scipy<1.17",
    "plotly>=5.18.0",
    "scikit-fuzzy>=0.5.0",
    "nltk>=3.9.2",
    "sentence-transformers>=5.2.3",
    "umap-learn>=0.5.11",
    "transformers>=5.2.0",
    "torch>=2.10.0",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "kneed>=0.8.5",
    "octis>=1.8.3",
    "bertopic>=0.17.4",
]

[dependency-groups]
dev = [
    "ruff>=0.14.11",
    "seaborn>=0.13.2",
]
